<div class="admin-page">
  <div class="page-header">
    <h1 class="page-title">Categorías</h1>
    <p class="page-subtitle">Gestión de categorías para clasificar los insumos</p>
  </div>
  <mat-card class="section-card">
    <mat-card-header>
      <mat-card-title>Listado de Categorías</mat-card-title>
      <mat-card-subtitle>{{ dataSource.data.length }} categoría(s) registradas</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="table-toolbar">
        <mat-form-field class="filter-field">
          <mat-label>Filtrar</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Buscar..." #input>
        </mat-form-field>
        <button (click)="abrirPopup(0, 1)" mat-raised-button color="primary"><mat-icon>add</mat-icon> Nueva</button>
      </div>
      <div *ngIf="error" class="error-msg">{{ error }}</div>
      <table mat-table [dataSource]="dataSource" class="data-table">
        <ng-container matColumnDef="editar">
          <th mat-header-cell *matHeaderCellDef style="width:70px;">Acción</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="abrirPopup(element, 2)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
          </td>
        </ng-container>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let element"><code>{{ element.id }}</code></td>
        </ng-container>
        <ng-container matColumnDef="nombreInsumo">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5,10,20,50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
