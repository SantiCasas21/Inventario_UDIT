<form [formGroup]="form" (ngSubmit)="guardarEstadoSalida">
    <mat-form-field class="example-full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre">
    </mat-form-field>

    <div mat-dialog-actions>
        @if(this.data.estado == 1){
            <button (click)="guardarEstadoSalida()" mat-raised-button color="accent">Agregar</button>
        }
        @else()
        {
            <button (click)="actualizarEstadoSalida()" mat-raised-button color="accent">Editar</button>
        }
        <button (click)="cerrarPopup()" mat-raised-button color="warn">Cerrar</button>
    </div>

</form>
