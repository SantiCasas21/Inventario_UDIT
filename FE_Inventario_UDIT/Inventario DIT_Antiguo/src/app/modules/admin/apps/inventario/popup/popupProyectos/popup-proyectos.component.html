<div class="flex flex-col bg-white rounded-lg">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-udit-verde text-white rounded-t">
    <h2 class="m-0 text-xl font-bold flex items-center shadow-text">
      <mat-icon class="mr-2">{{ data.estado === 1 ? 'add_circle' : 'edit' }}</mat-icon>
      {{ data.estado === 1 ? 'Crear Proyecto' : 'Editar Proyecto' }}
    </h2>
    <button mat-icon-button (click)="cerrarPopup()" class="text-white hover:bg-white/20 transition-colors">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <mat-dialog-content class="p-6">
    <form [formGroup]="form" class="flex flex-col gap-4 mt-2">
      <!-- Nombre -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Nombre del Proyecto</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">folder</mat-icon>
        <input matInput formControlName="nombre" placeholder="Ej: Brazo Robótico, Sistema IoT..." required>
        <mat-error *ngIf="form.get('nombre')?.hasError('required')">El nombre es obligatorio</mat-error>
      </mat-form-field>

      <!-- Descripción -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Descripción</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">description</mat-icon>
        <input matInput formControlName="descripcion" placeholder="Descripción breve de los objetivos del proyecto">
      </mat-form-field>

      <!-- Estado -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Estado del Proyecto</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">flag</mat-icon>
        <mat-select formControlName="idEstado" placeholder="Seleccione estado" required>
          <mat-option *ngFor="let estado of estados" [value]="estado.id">{{ estado.nombre }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('idEstado')?.hasError('required')">El estado es obligatorio</mat-error>
      </mat-form-field>

      <!-- Fecha Creación -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Fecha de Creación</mat-label>
        <mat-icon matPrefix class="text-gray-400 mr-2">calendar_today</mat-icon>
        <input matInput [matDatepicker]="pickerInicio" formControlName="fechaCreacion" placeholder="DD/MM/AAAA">
        <mat-datepicker-toggle matSuffix [for]="pickerInicio"></mat-datepicker-toggle>
        <mat-datepicker #pickerInicio></mat-datepicker>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
    <button mat-button (click)="cerrarPopup()" class="rounded-full text-gray-600 hover:bg-gray-200">Cancelar</button>
    <button mat-raised-button color="primary" class="btn-gloss shadow-md" 
            (click)="data.estado === 1 ? guardarProyectos() : actualizarProyectos()" 
            [disabled]="form.invalid">
      <mat-icon class="mr-1">{{ data.estado === 1 ? 'save' : 'update' }}</mat-icon>
      {{ data.estado === 1 ? 'Crear' : 'Guardar Cambios' }}
    </button>
  </mat-dialog-actions>
</div>
