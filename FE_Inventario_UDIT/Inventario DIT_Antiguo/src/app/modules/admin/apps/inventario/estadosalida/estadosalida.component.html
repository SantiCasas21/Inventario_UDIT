<div style="width: 100%;">
    <div class="flex flex-col flex-auto w-full">
        <div class="flex flex-wrap w-full max-w-screen-xl mx-auto p-6 md:p-8">
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8 w-full mt-8">
                <div class="xl:col-span-2 flex flex-col flex-auto bg-card shadow rounded-2xl overflow-hidden">
                    <div class="p-6">
                        <div class="mr-4 text-lg font-medium tracking-tight leading-6 truncate">Estado Salida</div>
                        <button (click)="abrirPopup(0, 1)" mat-raised-button color="primary">Añadir Estado Salida (+)</button>
                    </div>
                    <div class="overflow-x-auto mx-6">
                        <mat-form-field>
                            <mat-label>Filtro</mat-label>
                            <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Nombre" #input>
                        </mat-form-field>
                        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                            <ng-container matColumnDef="editar">
                                <th mat-header-cell *matHeaderCellDef style="width: 80px;"> </th>
                                <td mat-cell *matCellDef="let element">
                                    <button mat-icon-button color="primary" (click)="abrirPopup(element, 2)">
                                        <mat-icon>edit</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="id">
                                <th mat-header-cell *matHeaderCellDef> Id</th>
                                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                            </ng-container>

                            <ng-container matColumnDef="nombre">
                                <th mat-header-cell *matHeaderCellDef> Nombre </th>
                                <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                        </table>
                        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page of estado salida"></mat-paginator>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
