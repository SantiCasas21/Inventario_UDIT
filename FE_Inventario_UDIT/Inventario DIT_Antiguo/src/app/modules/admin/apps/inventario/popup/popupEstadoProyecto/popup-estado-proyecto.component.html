<form [formGroup]="form" (ngSubmit)="guardarEstadoProyecto">
    <mat-form-field class="example-full-width">
        <mat-label>Estado</mat-label>
        <input matInput formControlName="estado">
    </mat-form-field>


    <div mat-dialog-actions>
        @if(this.data.estado == 1){
            <button (click)="guardarEstadoProyecto()" mat-raised-button color="accent">Agregar</button>
        }
        @else()
        {
            <button (click)="actualizarEstadoProyecto()" mat-raised-button color="accent">Editar</button>
        }
        <button (click)="cerrarPopup()" mat-raised-button color="warn">Cerrar</button>
    </div>

</form>
