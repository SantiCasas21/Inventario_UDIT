<!-- Button -->
<button
    mat-icon-button
    [matMenuTriggerFor]="userActions">
    <span class="relative flex items-center justify-center">
        <img
            class="w-8 h-8 rounded-full object-cover shadow-sm ring-1 ring-indigo-200"
            *ngIf="showAvatar && user?.avatar"
            [src]="user.avatar">
        <div
            *ngIf="!showAvatar || !user?.avatar"
            class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shadow-sm"
            [ngClass]="{
                'avatar-admin': user?.role === 'Admin',
                'avatar-developer': user?.role === 'Developer',
                'avatar-assistant': user?.role === 'Assistant',
                'avatar-user': user?.role === 'User'
            }">
            {{ getUserInitials() }}
        </div>
        <span
            class="absolute right-0 bottom-0 w-2.5 h-2.5 rounded-full ring-2 ring-white"
            [ngClass]="{'bg-green-500': user?.status === 'online' || !user?.status,
                          'bg-amber-500': user?.status === 'away',
                          'bg-red-500': user?.status === 'busy',
                          'bg-gray-400': user?.status === 'not-visible'}"
        ></span>
    </span>
</button>

<mat-menu
    [xPosition]="'before'"
    #userActions="matMenu">
    <div class="px-4 py-2.5 flex flex-col leading-none border-b border-gray-100">
        <span class="font-bold text-gray-900 text-sm">{{user?.nombreCompleto || user?.username}}</span>
        <span class="text-xs text-indigo-600 font-medium mt-0.5">&#64;{{user?.username}} &bull; {{user?.role}}</span>
        <span class="text-xs text-gray-400 mt-1" *ngIf="user?.email">{{user?.email}}</span>
    </div>

    
    <button mat-menu-item [routerLink]="['/perfil']">
        <mat-icon [svgIcon]="'heroicons_outline:user-circle'"></mat-icon>
        <span class="font-medium">Mi Perfil</span>
    </button>
    
    <button
        mat-menu-item
        [matMenuTriggerFor]="userStatus">
        <mat-icon [svgIcon]="'heroicons_outline:ellipsis-horizontal-circle'"></mat-icon>
        <span>Estado</span>
    </button>
    <mat-divider class="my-2"></mat-divider>
    <button
        mat-menu-item
        (click)="signOut()">
        <mat-icon [svgIcon]="'heroicons_outline:arrow-right-on-rectangle'"></mat-icon>
        <span class="text-red-600 font-medium">Cerrar Sesión</span>
    </button>
</mat-menu>


<mat-menu
    class="user-status-menu"
    #userStatus="matMenu">
    <button
        mat-menu-item
        (click)="updateUserStatus('online')">
        <span class="w-4 h-4 mr-3 rounded-full bg-green-500"></span>
        <span>Online</span>
    </button>
    <button
        mat-menu-item
        (click)="updateUserStatus('away')">
        <span class="w-4 h-4 mr-3 rounded-full bg-amber-500"></span>
        <span>Away</span>
    </button>
    <button
        mat-menu-item
        (click)="updateUserStatus('busy')">
        <span class="w-4 h-4 mr-3 rounded-full bg-red-500"></span>
        <span>Busy</span>
    </button>
    <button
        mat-menu-item
        (click)="updateUserStatus('not-visible')">
        <span class="w-4 h-4 mr-3 rounded-full bg-gray-400"></span>
        <span>Invisible</span>
    </button>
</mat-menu>
