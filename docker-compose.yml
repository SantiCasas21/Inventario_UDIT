services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: udit-inventario-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=InventarioV2_2026!
      - MSSQL_PID=Express
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "InventarioV2_2026!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./BE_Inventario_UDIT
      dockerfile: src/API/Dockerfile
    container_name: udit-inventario-api
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UDIT_Inventario_V2;User Id=sa;Password=InventarioV2_2026!;TrustServerCertificate=True;Encrypt=False
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
